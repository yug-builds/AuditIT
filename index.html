<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUDIT IT - Modern Invoice & GST Verification for Retail Stores</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Real-Time Client-Side OCR Engine (Tesseract.js) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- Real-Time Client-Side PDF Text Extractor (PDF.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased selection:bg-emerald-100 selection:text-emerald-900">

  <!-- TOP HEADER (Trustworthy Slate, White & Subtle Emerald) -->
  <header id="app-header" class="bg-white border-b border-slate-200/90 sticky top-0 z-40 backdrop-blur-md bg-white/95">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Brand Logo & Tagline -->
      <a href="./index.html" class="flex items-center space-x-3 group">
        <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-white shadow-sm group-hover:bg-slate-800 transition-colors">
          <span class="font-extrabold text-sm tracking-wider">A<span class="text-emerald-400">I</span></span>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="text-base sm:text-lg font-black tracking-tight text-slate-900">AUDIT <span class="text-emerald-600 font-extrabold">IT</span></span>
            <span class="hidden sm:inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-emerald-50 text-emerald-700 border border-emerald-200">
              Retail Edition
            </span>
          </div>
          <span class="text-[11px] text-slate-500 font-medium hidden sm:block">Indian Small Retail & Kirana Bill Verification</span>
        </div>
      </a>

      <!-- Right Header Indicators -->
      <div class="flex items-center space-x-3 sm:space-x-4">
        <!-- Trust Signal -->
        <div class="hidden md:flex items-center space-x-1.5 px-3 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span>100% Deterministic Code Audit</span>
        </div>

        <div class="flex items-center space-x-1 text-xs font-semibold text-slate-700 bg-emerald-50/80 px-2.5 py-1 rounded-lg border border-emerald-200">
          <span class="text-emerald-700">₹</span>
          <span>INR Compliant</span>
        </div>
      </div>

    </div>
  </header>

  <!-- MAIN APP MOUNT POINT -->
  <main id="app-main" class="flex-1"></main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200 mt-auto py-6 text-center text-xs text-slate-500 print:hidden">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center space-x-2">
        <span class="font-bold text-slate-800">AUDIT IT</span>
        <span>•</span>
        <span>Strict "AI Reads, Code Calculates" Architecture</span>
      </div>
      <div class="text-[11px] text-slate-400">
        Bank details & private numbers are automatically masked on the client side.
      </div>
    </div>
  </footer>

  <!-- MODAL MOUNT POINT -->
  <div id="modal-container"></div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- APP ENTRY MODULE -->
  <script type="module" src="./app.js"></script>
</body>
</html>
